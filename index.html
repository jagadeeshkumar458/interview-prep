<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Interview questions by technology and concept, with answers, a coding playground and mock interviews. Works offline.">
<meta name="theme-color" content="#2b54d6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Interview Prep Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a study notebook — graph-paper desk, technology "subjects", concept index cards, ruled question lists */
:root{
  --paper:#f2f4f7; --sheet:#ffffff; --ink:#172033; --ink-2:#4a5568; --ink-3:#7b8597;
  --rule:#dde2ea; --grid:rgba(40,70,140,.055);
  --accent:#2b54d6; --accent-ink:#ffffff; --accent-soft:#e6ecfc; --li:#0a66c2;
  --mark:#ffe873; --mark-ink:#3a3100;
  --beg:#1f8a5b; --int:#b26b00; --adv:#c23a3a;
  --done:#1f8a5b;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --radius:10px;
  --pink:#e0479e; --teal:#12a594; --blob-op:.16;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11151d; --sheet:#181e29; --ink:#e7ebf2; --ink-2:#aab3c3; --ink-3:#7c8698;
  --rule:#2a3242; --grid:rgba(130,160,230,.06);
  --accent:#7d9bff; --accent-ink:#0d1220; --accent-soft:#1f2a47; --li:#70b5f9;
  --mark:#d9c24a; --mark-ink:#1d1800;
  --beg:#4cc58f; --int:#e7a94a; --adv:#f07a7a; --done:#4cc58f; --pink:#ff7ac3; --teal:#3fd2bf; --blob-op:.13; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11151d; --sheet:#181e29; --ink:#e7ebf2; --ink-2:#aab3c3; --ink-3:#7c8698;
  --rule:#2a3242; --grid:rgba(130,160,230,.06);
  --accent:#7d9bff; --accent-ink:#0d1220; --accent-soft:#1f2a47; --li:#70b5f9;
  --mark:#d9c24a; --mark-ink:#1d1800;
  --beg:#4cc58f; --int:#e7a94a; --adv:#f07a7a; --done:#4cc58f; --pink:#ff7ac3; --teal:#3fd2bf; --blob-op:.13; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;min-height:100vh}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 64px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.mono{font-family:var(--f-mono)}
.tnum{font-variant-numeric:tabular-nums}

/* top bar */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:28px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.brand-mark{width:34px;height:34px;border-radius:8px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:13px}
.brand-name{font-family:var(--f-display);font-weight:800;font-size:18px}
.crumbs{display:flex;align-items:center;gap:6px;color:var(--ink-3);font-size:14px;flex-wrap:wrap;min-width:0}
.crumbs button{background:none;border:0;padding:2px 4px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--rule)}
.crumbs .here{color:var(--ink);font-weight:700}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:8px;padding:9px 14px;border:1px solid var(--rule);background:var(--sheet);font-weight:700;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn svg{width:16px;height:16px}
.sync{font-size:12px;color:var(--ink-3);font-family:var(--f-mono)}

/* home */
.hero{display:grid;gap:10px;margin:8px 0 28px;max-width:720px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600}
.hero h1{font-size:clamp(34px,6vw,56px);font-weight:800;line-height:1.02}
.hero p{color:var(--ink-2);margin:0;font-size:17px;max-width:62ch}
.techs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.tech{position:relative;text-align:left;border:1px solid var(--rule);background:var(--sheet);border-radius:14px;padding:20px;display:grid;gap:14px;min-height:190px;transition:transform .15s,border-color .15s,box-shadow .15s}
.tech:hover{border-color:var(--tc)}
.tech-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.glyph{font-family:var(--f-mono);font-weight:600;font-size:15px;padding:6px 9px;border-radius:8px;background:color-mix(in srgb,var(--tc) 14%,transparent);color:var(--tc)}
.tech h2{font-size:26px;font-weight:700}
.tech .meta{color:var(--ink-2);font-size:14px}
.tech .big{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1}
.tech .big small{font-family:var(--f-body);font-weight:400;font-size:14px;color:var(--ink-3);margin-left:6px}
.tech.empty .big{color:var(--ink-3)}
.prog{height:6px;border-radius:99px;background:var(--rule);overflow:hidden}
.prog i{display:block;height:100%;background:var(--done);border-radius:99px}
.home-foot{margin-top:28px;color:var(--ink-3);font-size:14px;max-width:70ch}
.home-foot strong{color:var(--ink-2)}

/* tech view */
.thead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:18px 28px;margin-bottom:22px}
.thead h1{font-size:clamp(30px,5vw,46px);font-weight:800;line-height:1}
.stats{display:flex;gap:22px;flex-wrap:wrap}
.stat{display:grid}
.stat b{font-family:var(--f-display);font-size:24px;font-weight:700;line-height:1.1}
.stat span{font-size:12px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
.search{flex:1 1 280px;position:relative;min-width:0}
.search input{width:100%;padding:11px 14px 11px 40px;border-radius:10px;border:1px solid var(--rule);background:var(--sheet)}
.search svg{position:absolute;left:13px;top:50%;translate:0 -50%;width:17px;height:17px;color:var(--ink-3)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:10px;background:var(--sheet);padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:7px;padding:6px 11px;font-size:13px;font-weight:700;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{text-align:left;border:1px solid var(--rule);background:var(--sheet);border-radius:var(--radius);padding:16px 16px 14px;display:grid;gap:10px;position:relative;overflow:hidden;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--accent)}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:28px;background:repeating-linear-gradient(transparent 0 27px,var(--rule) 27px 28px);opacity:.0}
.card-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h3{font-size:17px;font-weight:700;line-height:1.2}
.count{font-family:var(--f-mono);font-weight:600;font-size:13px;color:var(--ink-2);white-space:nowrap}
.card p{margin:0;color:var(--ink-3);font-size:13.5px;line-height:1.4}
.mix{display:flex;height:5px;border-radius:99px;overflow:hidden;background:var(--rule)}
.mix i{display:block;height:100%}
.card-foot{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink-3);gap:8px}
.card.zero{opacity:.62}
.card.zero:hover{opacity:1}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:99px;padding:2px 8px;white-space:nowrap}
.ring{width:22px;height:22px}

/* concept view */
.chead{display:grid;gap:8px;margin-bottom:18px}
.chead h1{font-size:clamp(28px,4.6vw,42px);font-weight:800;line-height:1.05}
.chead p{margin:0;color:var(--ink-2);max-width:65ch}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;overflow:hidden}
.qlist{list-style:none;margin:0;padding:0}
.q{border-top:1px solid var(--rule);display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;padding:14px 16px;align-items:start}
.q:first-child{border-top:0}
.qn{font-family:var(--f-mono);font-size:13px;color:var(--ink-3);padding-top:3px;min-width:2.4em;text-align:right}
.qbody{min-width:0;display:grid;gap:6px}
.qtext{font-size:16px;line-height:1.45;font-weight:400;overflow-wrap:anywhere}
.q.done .qtext{color:var(--ink-3)}
.q.star .qtext{background:linear-gradient(transparent 55%,color-mix(in srgb,var(--mark) 70%,transparent) 55%);box-decoration-break:clone;-webkit-box-decoration-break:clone;color:var(--ink)}
.qmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--ink-3)}
.lv{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:5px;border:1px solid currentColor}
.lv.B{color:var(--beg)} .lv.I{color:var(--int)} .lv.A{color:var(--adv)}
.src{font-family:var(--f-mono);font-size:11px;padding:2px 7px;border-radius:5px;background:var(--paper);color:var(--ink-2);text-decoration:none;border:1px solid var(--rule)}
.src:hover{border-color:var(--ink-3)}
.src.mine{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.hasnote{color:var(--accent);font-weight:700}
.qact{display:flex;gap:4px;align-items:center}
.ico{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;border:1px solid transparent;background:none;color:var(--ink-3)}
.ico:hover{border-color:var(--rule);color:var(--ink)}
.ico svg{width:18px;height:18px}
.ico[aria-pressed="true"].tick{color:var(--done)}
.ico[aria-pressed="true"].starb{color:var(--int)}
.ico[aria-expanded="true"]{color:var(--accent)}
.notes{grid-column:2 / 4;display:grid;gap:6px}
.notes textarea{width:100%;min-height:110px;resize:vertical;border:1px solid var(--rule);border-radius:8px;padding:10px 12px;background:var(--paper);line-height:1.5;
  background-image:repeating-linear-gradient(transparent 0 23px,var(--rule) 23px 24px);background-attachment:local;background-position:0 9px;font-size:15px}
.notes .row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.linkbtn{background:none;border:0;padding:0;color:var(--adv);font-size:12px;font-weight:700;text-decoration:underline}
.empty-state{padding:36px 20px;text-align:center;color:var(--ink-2);display:grid;gap:12px;justify-items:center}
.empty-state h3{font-size:20px}
.grouphead{padding:10px 16px;background:var(--paper);border-top:1px solid var(--rule);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700;display:flex;justify-content:space-between}
.grouphead:first-child{border-top:0}
.grouphead button{background:none;border:0;color:var(--accent);font-weight:700;letter-spacing:.04em;text-transform:none;font-size:13px;padding:0}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,14,24,.5);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:50}
.modal{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;width:min(560px,100%);max-height:100%;overflow:auto;padding:22px;display:grid;gap:14px}
.modal h2{font-size:22px}
.field{display:grid;gap:5px}
.field label{font-size:13px;font-weight:700;color:var(--ink-2)}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--rule);border-radius:8px;padding:10px 12px;background:var(--paper)}
.field textarea{min-height:90px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:12.5px;color:var(--ink-3)}
.err{color:var(--adv);font-size:13px;font-weight:700}
.mfoot{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));translate:-50% 0;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-weight:700;font-size:14px;z-index:60;max-width:calc(100% - 32px)}

/* practice */
.flash{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:28px;display:grid;gap:18px;min-height:240px;
  background-image:linear-gradient(90deg,transparent 52px,color-mix(in srgb,var(--adv) 35%,transparent) 52px 53px,transparent 53px),repeating-linear-gradient(transparent 0 31px,var(--rule) 31px 32px);background-position:0 0,0 18px}
.flash .qtext{font-family:var(--f-display);font-size:clamp(22px,3.4vw,30px);font-weight:700;line-height:1.25;padding-left:44px}
.flash .qmeta{padding-left:44px}
.flash .acts{display:flex;gap:10px;flex-wrap:wrap;padding-left:44px}
/* mock interview */
.iv-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:20px;display:grid;gap:16px;min-width:0}
.panel h2{font-size:20px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{border:1px solid var(--rule);background:var(--paper);border-radius:99px;padding:5px 11px;font-size:13px;font-weight:700;color:var(--ink-2)}
.chipbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chipbtn small{font-family:var(--f-mono);font-weight:400;opacity:.8;margin-left:4px}
.hist{list-style:none;margin:0;padding:0;display:grid}
.hist li{border-top:1px solid var(--rule)}
.hist li:first-child{border-top:0}
.hist button{width:100%;background:none;border:0;padding:12px 2px;display:flex;justify-content:space-between;gap:10px;text-align:left;align-items:center}
.hist .hmeta{color:var(--ink-3);font-size:13px}
.score{font-family:var(--f-display);font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.sc-good{color:var(--beg)} .sc-mid{color:var(--int)} .sc-low{color:var(--adv)}
.ivbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.steps{display:flex;gap:4px;flex:1;min-width:160px}
.steps i{flex:1;height:6px;border-radius:99px;background:var(--rule)}
.steps i.on{background:var(--accent)} .steps i.ok{background:var(--done)} .steps i.bad{background:var(--adv)} .steps i.mid{background:var(--int)}
.asker{display:flex;gap:12px;align-items:flex-start}
.avatar{flex:none;width:38px;height:38px;border-radius:10px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;font-weight:600}
.bubble{min-width:0;display:grid;gap:8px}
.bubble .who{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.bubble .say{font-family:var(--f-display);font-size:clamp(20px,3vw,26px);font-weight:700;line-height:1.28;overflow-wrap:anywhere}
.bubble .say.fu{font-size:clamp(18px,2.6vw,22px)}
.answer textarea{width:100%;min-height:170px;resize:vertical;border:1px solid var(--rule);border-radius:10px;padding:12px 14px;background:var(--paper);font-size:16px;line-height:1.55}
.answer .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.thinking{display:flex;align-items:center;gap:10px;color:var(--ink-2);font-weight:700}
.dots{display:inline-flex;gap:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.fb{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start}
.dial{width:96px;height:96px;position:relative;display:grid;place-items:center}
.dial svg{position:absolute;inset:0}
.dial .score{font-size:34px}
.dial small{display:block;font-size:11px;color:var(--ink-3);text-align:center;font-family:var(--f-mono)}
.subs{display:grid;gap:8px;min-width:0}
.sub{display:grid;grid-template-columns:80px 1fr 28px;gap:10px;align-items:center;font-size:13px;color:var(--ink-2)}
.sub .bar{height:7px;border-radius:99px;background:var(--rule);overflow:hidden}
.sub .bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.sub b{font-family:var(--f-mono);font-size:13px;text-align:right}
.pts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pts h4{margin:0 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.pts ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14.5px}
.ideal{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:14px 16px;font-size:14.5px;line-height:1.55}
.ideal h4{margin:0 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.verdict{font-family:var(--f-mono);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.selfrate{display:flex;gap:8px;flex-wrap:wrap}
.notice{background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:12px 14px;font-size:14px}
.rep-items{list-style:none;margin:0;padding:0}
.rep-items li{border-top:1px solid var(--rule);padding:12px 0;display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.rep-items li:first-child{border-top:0}
.rep-items .score{font-size:22px;text-align:right}
.rep-items details summary{cursor:pointer;color:var(--accent);font-size:13px;font-weight:700;margin-top:4px}
.cbar{display:grid;grid-template-columns:minmax(0,1fr) 120px 34px;gap:10px;align-items:center;font-size:14px}
.cbar .bar{height:8px;border-radius:99px;background:var(--rule);overflow:hidden}
.cbar .bar i{display:block;height:100%;border-radius:99px}
.lastsc{font-family:var(--f-mono);font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px;background:var(--paper);border:1px solid var(--rule)}
/* question kinds + snippets */
.kchip{font-family:var(--f-mono);font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px;background:var(--accent-soft);color:var(--accent)}
.kchip.k-o{background:color-mix(in srgb,var(--int) 16%,transparent);color:var(--int)}
.kchip.k-d{background:color-mix(in srgb,var(--beg) 16%,transparent);color:var(--beg)}
.src.practice{background:var(--ink);color:var(--paper);border-color:var(--ink);cursor:pointer;font-weight:600}
pre.snip,pre.code{margin:0;font-family:var(--f-mono);font-size:13px;line-height:1.6;background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:10px 12px;overflow-x:auto;white-space:pre;max-width:100%}
/* playground */
.pgband{margin-top:28px;display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;background:var(--ink);color:var(--paper);border-radius:16px;padding:22px 24px}
.pgband h2{font-size:clamp(22px,3vw,30px);font-weight:800;margin:4px 0 6px}
.pgband p{margin:0;color:color-mix(in srgb,var(--paper) 78%,transparent);max-width:60ch}
.pgband .eyebrow{color:color-mix(in srgb,var(--accent) 60%,var(--paper))}
.pgband .btn{border-color:transparent}

function allQs(){ return BANK.concat(CUSTOM); }
function qsFor(t, c){ return allQs().filter(q=>q.t===t && (c==null || q.c===c)); }
function conceptsFor(t){
  const base = (TECH[t]?.concepts||[]).map(([k,n,d])=>({k,n,d}));
  const known = new Set(base.map(c=>c.k));
  CUSTOM.filter(q=>q.t===t && !known.has(q.c)).forEach(q=>{ known.add(q.c); base.push({k:q.c, n:q.cn||q.c, d:"A concept you added."}); });
  return base;
}
function conceptName(t,c){ return conceptsFor(t).find(x=>x.k===c)?.n || c; }
const lvOrder = {B:0,I:1,A:2};
function sortQs(list){ return list.slice().sort((a,b)=>(lvOrder[a.l]??1)-(lvOrder[b.l]??1)); }
function passFilters(q){
  const p = PROG[q.i]||{};
  if(ui.lv!=="all" && q.l!==ui.lv) return false;
  if(ui.kind!=="all" && (q.k||"t")!==ui.kind) return false;
  if(ui.filter==="todo" && p.d) return false;
  if(ui.filter==="done" && !p.d) return false;
  if(ui.filter==="star" && !p.s) return false;
  return true;
}
function stats(list){
  let done=0, star=0; for(const q of list){ const p=PROG[q.i]; if(p?.d) done++; if(p?.s) star++; }
  return {total:list.length, done, star, pct: list.length? Math.round(done*100/list.length):0};
}

let saveChain = Promise.resolve();
function saveSession(s){
  const i = SESSIONS.findIndex(x=>x.id===s.id); if(i>=0) SESSIONS[i]=s; else SESSIONS.unshift(s);
  local.set("ipd_sessions", SESSIONS.slice(0,30));
  if(!db) return;
  const body = JSON.parse(JSON.stringify(s)); delete body.id;
  saveChain = saveChain.then(()=>db.doc("interviews/"+s.id).set(body)).catch(handleWriteErr);
}
const pendingNote = {};
async function writeProg(id, patch){
  const cur = {...(PROG[id]||{}), ...patch};
  const clean = {d:!!cur.d, s:!!cur.s, n:(cur.n||"").slice(0,20000)};
  if(typeof cur.ls==="number") clean.ls = cur.ls;
  if(typeof cur.na==="number") clean.na = cur.na;
  PROG[id] = clean; local.set("ipd_prog", PROG);
  if(!db) return;
  try{
    if(!clean.d && !clean.s && !clean.n && clean.na==null) await db.doc("progress/"+id).delete();
    else await db.doc("progress/"+id).set(clean);
  }catch(e){ handleWriteErr(e); }
}
function handleWriteErr(e){
  if(e?.code==="invalid_argument"){ canWrite=false; toast("You can view this page but not save changes to it."); }
  else if(e?.code==="quota_exceeded"){ toast("Storage is full. Delete a few of your own questions to make room."); }
  else toast("Couldn't save. Check your connection and try again.");
}

let lastRouteKey = null, navFromPop = false, navDepth = 0;
const reduceMotion = (()=>{ try{ return matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){ return false; } })();
function parentRoute(r){
  switch(r.v){
    case "tech": return {v:"home"};
    case "concept": case "practice": return r.c && r.v==="practice" ? {v:"concept", t:r.t, c:r.c} : {v:"tech", t:r.t};
    case "pgc": case "scratch": return {v:"pg"};
    case "report": return {v:"interview"};
    default: return {v:"home"};
  }
}
function routeLabel(r){
  if(r.v==="home") return "all subjects";
  if(r.v==="tech") return TECH[r.t]?.n || "subject";
  if(r.v==="concept") return conceptName(r.t, r.c);
  if(r.v==="pg") return "the playground";
  if(r.v==="interview") return "mock interview";
  return "back";
}
function goBack(){
  if(navDepth>0){ try{ history.back(); return; }catch(e){} }
  route = parentRoute(route); ui.q=""; render(); window.scrollTo({top:0});
}
window.addEventListener("popstate", e=>{
  const r = e.state && e.state.ipdRoute; if(!r) return;
  navFromPop = true; navDepth = Math.max(0, navDepth-1);
  route = r; if(route.v==="pgc" && !pgCurrent()) route = {v:"pg"};
  if(route.v==="practice" && !ui.practice) route = {v:"tech", t:route.t};
  ui.q=""; render(); navFromPop = false; window.scrollTo({top:0});
});
document.addEventListener("click", e=>{ if(e.target.closest("[data-back]")) goBack(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && !$("#modalRoot").innerHTML && route.v!=="home" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||"")) goBack(); });
function backBar(){
  if(route.v==="home") return "";
  const p = parentRoute(route);
  return `<div class="backbar"><button type="button" class="backbtn" data-back aria-label="Go back to ${esc(routeLabel(p))}"><span class="arrow" aria-hidden="true">←</span> Back to ${esc(routeLabel(p))}</button></div>`;
}

function render(){
  const key = JSON.stringify(route);
  const changed = key !== lastRouteKey;
  if(changed){
    try{
      if(lastRouteKey===null) history.replaceState({ipdRoute:route}, "");
      else if(!navFromPop){ history.pushState({ipdRoute:route}, ""); navDepth++; }
    }catch(e){}
    lastRouteKey = key;
  }
  if(changed && !reduceMotion && document.startViewTransition && lastRouteKey && document.visibilityState==="visible"){
    try{ document.startViewTransition(()=>paint(true)); return; }catch(e){}
  }
  paint(changed);
}
function paint(changed){
  saveUi(); renderCrumbs();
  const v = $("#view");
  if(route.v==="tech" && TECH[route.t]) v.innerHTML = techView(route.t);
  else if(route.v==="concept" && TECH[route.t]) v.innerHTML = conceptView(route.t, route.c);
  else if(route.v==="practice" && TECH[route.t]) v.innerHTML = practiceView();
  else if(route.v==="interview") v.innerHTML = IV && IV.phase!=="report" ? ivRunView() : ivSetupView();
  else if(route.v==="report") v.innerHTML = ivReportView(SESSIONS.find(s=>s.id===route.id));
  else if(route.v==="pg") v.innerHTML = pgHomeView();
  else if(route.v==="pgc") v.innerHTML = pgChallengeView();
  else if(route.v==="scratch") v.innerHTML = scratchView();
  else if(route.v==="sources") v.innerHTML = sourcesView();
  else { route={v:"home"}; v.innerHTML = homeView(); }
  if(route.v!=="home") v.insertAdjacentHTML("afterbegin", backBar());
  bindView();
  if(changed) enterAnimations(v);
}
function enterAnimations(v){
  if(reduceMotion) return;
  v.classList.remove("entering"); void v.offsetWidth; v.classList.add("entering");
  v.querySelectorAll(".techs>*, .cards>*, .pgcards>*, .qlist>li, .hist>li, .rep-items>li, .srcrow, .choices>*").forEach((el,i)=>el.style.setProperty("--i", Math.min(i, 16)));
  v.querySelectorAll("[data-count]").forEach(el=>{
    const to = Number(el.dataset.count), suffix = el.dataset.suffix||""; if(!to) return;
    const t0 = performance.now(), dur = 700;
    const step = now=>{ const k = Math.min(1,(now-t0)/dur), e = 1-Math.pow(1-k,3); el.textContent = Math.round(to*e)+suffix; if(k<1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
  clearTimeout(enterAnimations.t); enterAnimations.t = setTimeout(()=>v.classList.remove("entering"), 1400);
}
// 3D tilt + spotlight that follows the pointer on tiles
document.addEventListener("pointermove", e=>{
  if(reduceMotion || e.pointerType==="touch") return;
  const el = e.target.closest?.(".tilt"); if(!el) return;
  const r = el.getBoundingClientRect(); const x = (e.clientX-r.left)/r.width, y = (e.clientY-r.top)/r.height;
  el.style.setProperty("--ry", ((x-.5)*10).toFixed(2)+"deg"); el.style.setProperty("--rx", ((.5-y)*8).toFixed(2)+"deg");
  el.style.setProperty("--mx", (x*100).toFixed(1)+"%"); el.style.setProperty("--my", (y*100).toFixed(1)+"%");
});
document.addEventListener("pointerout", e=>{ const el = e.target.closest?.(".tilt"); if(el && !el.contains(e.relatedTarget)){ el.style.setProperty("--rx","0deg"); el.style.setProperty("--ry","0deg"); } });
// celebration burst
function confetti(){
  if(reduceMotion) return;

const liUrl = id => `https://www.linkedin.com/feed/update/urn:li:activity:${id}/`;

// ================= ANSWERS =================
// Answers are original (written by Claude, never copied from the sources) and saved once,
// so every later visit shows them instantly. Source links stay on every question.
let ANS = {};                 // qid -> {a, p, c, lang, f}  (answers saved on this page, newest wins)
let PRE = {};                 // answers.json: one prepared answer per question, written by Claude for this desk
let LIS = {};                 // answers.json "li": qid -> [{au,id,s}] summaries of what a LinkedIn post's author said
const ANSGEN = new Set();     // qids being written right now
let ansBatch = null;          // {total, done, ctl, err}
let ALIASES = {};
const md = s => esc(s||"").replace(/`([^`]+)`/g, "<code>$1</code>");
function staticAnswer(q){
  if(!q.pg || q.k!=="c") return null;
  const it = PG.items.find(i=>i.id===q.pg); if(!it) return null;
  const code = it.write ? it.write.solution : it.fill ? it.fill.code.replace(/\[\[(\d+)\]\]/g,(_,n)=>it.fill.answers[n-1]) : "";
  return {a: it.brief + (it.explain ? " " + it.explain : ""), p: [], c: code, lang: it.t==="react"?"jsx":"js", f: "", fromPg: it};
}
const ansFor = q => ANS[q.i] || PRE[q.i] || null;
function hasAnswer(q){ return !!(ansFor(q) || staticAnswer(q) || LIS[q.i]); }
function isAnsOpen(q){ return ui.openAns?.has(q.i) || (ui.allAns && hasAnswer(q)); }
function answerBlock(q){
  const A = ansFor(q), S = staticAnswer(q);
  const srcLinks = (q.s||[]).map(k=>SOURCES[k]).filter(Boolean).map(S2=>S2.url?`<a href="${S2.url}" target="_blank" rel="noopener">${esc(S2.n)} ↗</a>`:`<span>${esc(S2.n)}</span>`).join(" · ");
  const posts = (q.li||[]).map(([id,au])=>`<a href="${liUrl(id)}" target="_blank" rel="noopener">${esc(liName(au))} ↗</a>`).join(" · ");
  const foot = `<div class="ans-foot"><span><b>Question from:</b> ${srcLinks||"—"}${posts?`<br><b>LinkedIn:</b> ${posts}`:""}</span>${A?`<span class="hint">Answer written by Claude for this desk, not copied from the sources.</span>`:""}</div>`;
  const LI = LIS[q.i]||[];
  const liBlock = (items, lead) => items.length ? `<div class="ans-li">${items.map(x=>`<div class="li-sum"><span class="eyebrow">${lead?"Answer from the post":"From LinkedIn"} · summarised from <a href="${liUrl(x.id)}" target="_blank" rel="noopener">${esc(liName(x.au))} ↗</a></span><p>${md(x.s)}</p></div>`).join("")}<p class="hint" style="margin:0">Summaries keep every point the author made, in our words. Open the post for their exact wording, or paste it into your notes.</p></div>` : "";
  if(ANSGEN.has(q.i)) return `<div class="answer"><div class="thinking"><span class="dots"><i></i><i></i><i></i></span>Writing the answer…</div>${foot}</div>`;
  const body = A || S;
  if(!body && LI.length) return `<div class="answer">${liBlock(LI,true)}
      <div class="ans-actions"><button type="button" class="linkbtn plain" data-ans-copy>Copy into my notes</button>${aiState==="ready"?`<button type="button" class="linkbtn plain" data-ans-gen>Write a full answer with Claude</button>`:""}</div>${foot}</div>`;
  if(!body){
    return `<div class="answer"><p style="margin:0">${aiState==="ready" ? "No answer saved for this one yet." : aiState==="checking" ? "Getting ready to write answers…" : "Answers are written by Claude the first time you open them, which needs this page open inside Claude."}</p>
      ${aiState==="ready"?`<div><button class="btn primary" type="button" data-ans-gen>Write the answer</button></div>`:""}${foot}</div>`;
  }
  return `<div class="answer">
      ${body.fromPg && !A?`<span class="eyebrow">Reference solution · playground challenge "${esc(body.fromPg.title)}"</span>`:""}
      <p class="ans-main">${md(body.a)}</p>
      ${body.p?.length?`<ul class="ans-points">${body.p.map(x=>`<li>${md(x)}</li>`).join("")}</ul>`:""}
      ${body.c?`<pre class="code ans-code"><code>${esc(body.c)}</code></pre>`:""}
      ${body.f?`<p class="ans-fu"><b>Likely follow-up:</b> ${md(body.f)}</p>`:""}
      ${A && S?`<details><summary class="hint" style="cursor:pointer">Reference solution from the playground</summary><pre class="code ans-code"><code>${esc(S.c)}</code></pre></details>`:""}
      ${liBlock(LI,false)}
      <div class="ans-actions">
        <button type="button" class="linkbtn plain" data-ans-copy>Copy into my notes</button>
        ${aiState==="ready"?`<button type="button" class="linkbtn plain" data-ans-gen>${A?"Rewrite this answer with Claude":"Write a full answer with Claude"}</button>`:""}
        ${q.pg||q.k==="c"||q.k==="o"?`<button type="button" class="linkbtn plain" data-practice-q="${esc(q.i)}">Practise it in the playground</button>`:""}
      </div>
      ${foot}</div>`;
}
function answersBar(list){
  const have = list.filter(hasAnswer).length, miss = list.length - have;
  const pct = list.length ? Math.round(have*100/list.length) : 0;
  return `<div class="ansbar">
      <div class="ansbar-info"><span><b class="tnum">${have}</b> of <b class="tnum">${list.length}</b> answers ready</span><div class="prog" aria-hidden="true"><i style="width:${pct}%"></i></div></div>
      <div class="ansbar-act">
        <button class="btn" type="button" data-ans-all aria-pressed="${!!ui.allAns}">${ui.allAns?"Collapse all answers":"Expand all answers"}</button>
        ${ansBatch ? `<span class="thinking" style="font-size:14px"><span class="dots"><i></i><i></i><i></i></span>Writing ${ansBatch.done} of ${ansBatch.total}…</span><button class="btn" type="button" data-ans-stop>Stop</button>`
          : miss && aiState==="ready" ? `<button class="btn primary" type="button" data-ans-batch>Write the ${miss} missing answer${miss>1?"s":""}</button>` : ""}
      </div>
      ${ansBatch?.err?`<p class="err" style="margin:0;flex-basis:100%">${esc(ansBatch.err)}</p>`:""}
    </div>`;
}

Rules:
- answer: 2-4 clear sentences in plain text. Wrap code identifiers in backticks.
- points: 3-5 short key points an interviewer listens for.
- code: a short example (under 20 lines) only when it genuinely helps; otherwise "". Use \\n for new lines.
- Coding questions: answer explains the approach and complexity; code is a complete, working solution.
- Predict-the-output questions given only a title: explain the behaviour the quiz tests and show it with a tiny snippet and its output in comments.
- System design questions: answer is a short overview; points are the main areas to cover (requirements, components, data and state, API, performance, accessibility).
- followUp: one likely follow-up question.
Return one entry per id, in the same order.`;
function normAns(x){
  return {a:String(x?.answer||"").trim(), p:(Array.isArray(x?.points)?x.points:[]).map(String).filter(Boolean).slice(0,6),
    c:String(x?.code||"").replace(/\s+$/,""), lang:String(x?.lang||"js").slice(0,12), f:String(x?.followUp||"").trim(), at:Date.now()};
}
async function writeAnswers(qs, signal, tier){
  const items = qs.map(q=>`[id=${q.i}] (${TECH[q.t]?.n||q.t} · ${conceptName(q.t,q.c)} · ${KINDS[q.k||"t"]}${q.l?" · "+LEVELS[q.l]:""}) ${q.q}${q.code?"\nCode:\n"+q.code:""}`).join("\n\n");
  const r = await sampleFn.json(fill(ANS_PROMPT, {items}), {modelTier:tier||"default", cache:false, signal});
  const list = Array.isArray(r?.answers) ? r.answers : [];
  let got = 0;
  for(const q of qs){
    const x = list.find(a=>String(a?.id)===q.i) || (qs.length===1 ? list[0] : null);
    if(!x) continue; const A = normAns(x); if(!A.a) continue;
    ANS[q.i] = A; got++;
    if(db){ try{ await db.doc("answers/"+safeId(q.i)).set(A); }catch(e){ handleWriteErr(e); } }
  }
  local.set("ipd_ans", ANS);
  return got;
}
async function genOne(qid){
  const q = allQs().find(x=>x.i===qid); if(!q || ANSGEN.has(qid)) return;
  if(aiState!=="ready"){ toast("Answers need AI, which isn't available in this view."); return; }
  ANSGEN.add(qid); ui.openAns.add(qid); softRender();
  try{ const n = await writeAnswers([q], undefined, ANS[qid] ? "default" : "quick"); if(!n) toast("The answer didn't come through. Try again."); }
  catch(e){ toast(e?.code==="rate_limited" ? "You've hit your Claude usage limit for now. Try again later." : e?.code==="not_granted" ? "AI was turned off for this page." : "The answer didn't come through. Try again."); }
  ANSGEN.delete(qid); softRender();
}
async function genBatch(list){
  const todo = list.filter(q=>!hasAnswer(q)); if(!todo.length) return;
  const ctl = new AbortController(); ansBatch = {total:todo.length, done:0, ctl, err:null}; softRender();
  const SIZE = 6;
  for(let i=0;i<todo.length;i+=SIZE){
    if(ctl.signal.aborted) break;
    const chunk = todo.slice(i, i+SIZE); chunk.forEach(q=>ANSGEN.add(q.i)); softRender();
    try{ await writeAnswers(chunk, ctl.signal); }
    catch(e){ chunk.forEach(q=>ANSGEN.delete(q.i));
      if(e?.code==="cancelled") break;
      ansBatch.err = e?.code==="rate_limited" ? "Stopped: you've hit your Claude usage limit. The answers written so far are saved." : e?.code==="not_granted" ? "Stopped: AI was turned off for this page." : "One batch failed; the rest carried on. Press the button again to fill any gaps.";
      if(e?.code==="rate_limited"||e?.code==="not_granted") break; }
    chunk.forEach(q=>ANSGEN.delete(q.i)); ansBatch.done = Math.min(todo.length, i+SIZE); softRender();
  }
  const err = ansBatch?.err; ansBatch = null; softRender();
  if(!err) { toast("Answers written and saved"); confetti(); } else toast(err);
}

    const cur = PROG[id]?.n || ""; writeProg(id, {n: (cur? cur+"\n\n" : "") + txt}); toast("Copied into your notes"); ui.openNotes.add(id); return render();

function migrateAliases(){
  if(migrateAliases.done || !Object.keys(ALIASES).length) return;
  if(db && !lastProgSnap) return;
  migrateAliases.done = true;
  const moves = Object.entries(ALIASES).filter(([o,n])=>PROG[o] && !PROG[n]);
  (async()=>{ for(const [o,n] of moves){ await writeProg(n, PROG[o]); delete PROG[o]; if(db){ try{ await db.doc("progress/"+o).delete(); }catch(e){} } } if(moves.length){ local.set("ipd_prog", PROG); softRender(); } })();
}

const fmt=(v,d=0,inner=false)=>{

  if(Array.isArray(v)){ if(!v.length) return '[]'; const parts=[]; let holes=0;
    for(let i=0;i<v.length;i++){ if(!(i in v)){ holes++; continue; } if(holes){ parts.push('<'+holes+' empty item'+(holes>1?'s':'')+'>'); holes=0; } parts.push(fmt(v[i],d+1,true)); }
    if(holes) parts.push('<'+holes+' empty item'+(holes>1?'s':'')+'>');
    return '[ '+parts.join(', ')+' ]'; }
  if(v instanceof Map) return 'Map('+v.size+') {'+(v.size?' '+[...v].map(([k,x])=>fmt(k,d+1,true)+' => '+fmt(x,d+1,true)).join(', ')+' ':'')+'}';
  if(v instanceof Set) return 'Set('+v.size+') {'+(v.size?' '+[...v].map(x=>fmt(x,d+1,true)).join(', ')+' ':'')+'}';

  return '{ '+keys.map(k=>(/^[A-Za-z_$][\\w$]*$/.test(k)?k:"'"+k+"'")+': '+fmt(v[k],d+1,true)).join(', ')+' }';
};
const logs=[]; const out=(...a)=>logs.push(a.map(x=>fmt(x)).join(' '));
console.log=out; console.info=out; console.warn=out; console.error=out;
const __deq=(a,b)=>{ if(Object.is(a,b)) return true; if(typeof a!=='object'||typeof b!=='object'||!a||!b) return false; if(Array.isArray(a)!==Array.isArray(b)) return false; const ka=Object.keys(a), kb=Object.keys(b); if(ka.length!==kb.length) return false; return ka.every(k=>__deq(a[k],b[k])); };
const __s=(x)=>{ try{ return fmt(x,0,true); }catch(e){ return String(x); } };
self.wait=(ms)=>new Promise(r=>setTimeout(r,ms));
self.expect=(v)=>({ toBe:(x)=>{ if(!Object.is(v,x)) throw new Error('Expected '+__s(x)+' but got '+__s(v)); },
  toEqual:(x)=>{ if(!__deq(v,x)) throw new Error('Expected '+__s(x)+' but got '+__s(v)); },
  toThrow:()=>{ let t=false; try{ v(); }catch(e){ t=true; } if(!t) throw new Error('Expected the function to throw'); } });
self.addEventListener('unhandledrejection', e=>e.preventDefault());
self.onmessage=async (e)=>{
  const {src, tests, settle}=e.data; const results=[];
  let body = src + '\\n;return (async()=>{ const __r=[];\\n';
  (tests||[]).forEach((t,i)=>{ body += 'try{ await (async()=>{ '+t.run+'\\n })(); __r.push([' + i + ',true]); }catch(err){ __r.push([' + i + ',false, String(err&&err.message||err)]); }\\n'; });
  body += 'return __r; })();';
  let fn;
  try{ fn = new Function(body); }catch(err){ postMessage({error:'Syntax error: '+err.message, logs}); return; }
  try{ const r = await fn(); if(settle) await new Promise(r=>setTimeout(r,settle)); postMessage({results:r||[], logs}); }
  catch(err){ if(settle) await new Promise(r=>setTimeout(r,settle)); postMessage({error:(err&&err.name?err.name+': ':'')+(err&&err.message||String(err)), logs}); }
};`;
let workerUrl = null;
function runCode(src, tests, {timeout=5000, settle=0}={}){
  return new Promise(resolve=>{
    let w;
    try{ workerUrl = workerUrl || URL.createObjectURL(new Blob([WORKER_SRC], {type:"text/javascript"})); w = new Worker(workerUrl); }
    catch(e){ return resolve({error:"This browser view can't run code (Web Workers are blocked).", logs:[]}); }
    const timer = setTimeout(()=>{ w.terminate(); resolve({error:`Stopped after ${timeout/1000}s. Is there an infinite loop or a promise that never settles?`, logs:[]}); }, timeout);
    w.onmessage = e=>{ clearTimeout(timer); w.terminate(); resolve(e.data); };
    w.onerror = e=>{ clearTimeout(timer); w.terminate(); resolve({error:e.message||"The code crashed.", logs:[]}); e.preventDefault?.(); };
    w.postMessage({src, tests, settle});
  });
}

function codeWithSlots(it, st){
  const parts = it.fill.code.split(/(\[\[\d+\]\])/);
  return parts.map(p=>{ const m = p.match(/^\[\[(\d+)\]\]$/);
    if(!m) return esc(p);
    const i = Number(m[1])-1; const v = st.slots[i];
    const cls = ["slot", v?"filled":"", st.sel===i&&!st.checked?"sel":"", st.checked? (v && v.t===it.fill.answers[i] ? "ok":"bad") : ""].join(" ");
    return `<button type="button" class="${cls}" data-slot="${i}" aria-label="Blank ${i+1}${v?": "+esc(v.t):""}">${v? esc(v.t) : "&nbsp;"+(i+1)+"&nbsp;"}</button>`;
  }).join("");
}
function resultsBlock(st){
  if(st.running) return `<div class="thinking"><span class="dots"><i></i><i></i><i></i></span>Running…</div>`;
  if(!st.results && !st.error && !st.logs) return "";
  const pass = (st.results||[]).filter(r=>r.ok).length, tot = (st.results||[]).length;
  return `<div class="field"><label>${st.error?`<span class="sc-low">${esc(st.error)}</span>`: tot? `<span class="${pass===tot?"sc-good":"sc-low"}">${pass} of ${tot} tests passed</span>` : "Output"}</label>
    ${tot?`<ul class="results">${st.results.map(r=>`<li><span class="${r.ok?"pass":"fail"}">${r.ok?"✓":"✗"}</span><span>${esc(r.name)}${r.msg?`<small>${esc(r.msg)}</small>`:""}</span></li>`).join("")}</ul>`:""}
    ${st.logs?`<div class="console" aria-label="Console output">${esc(st.logs)}</div>`:""}</div>`;
}

function normUrl(u){
  try{ const x = new URL(String(u).trim()); return (x.hostname.replace(/^www\./,"") + x.pathname.replace(/\/+$/,"")).toLowerCase(); }
  catch(e){ return String(u||"").trim().toLowerCase().replace(/^https?:\/\/(www\.)?/,"").replace(/[?#].*$/,"").replace(/\/+$/,""); }
}
function allSourceLinks(){
  const out = [];
  SRC.sources.forEach(s=>{ [s.url, ...(s.urls||[])].filter(Boolean).forEach(u=>{ if(!out.some(o=>normUrl(o.url)===normUrl(u))) out.push({url:u, src:s}); }); });
  return out;
}
function coveredBy(url){ const n = normUrl(url); return allSourceLinks().find(o=>normUrl(o.url)===n) || null; }

const GEN_PROMPTS = {
  js: `You are creating a practice exercise for this frontend interview question: "{{q}}" (topic: {{concept}}).
Write an original, self-contained JavaScript exercise for it. It must run in a Web Worker: no DOM, no network, no imports or libraries. Keep the solution under 40 lines.
Reply with only this JSON object:
{"title":"short name","brief":"1-3 sentences saying exactly what to implement, including the function or class name and its signature","solution":"complete working reference solution","starter":"the same signature with an empty body containing // your code","tests":[{"name":"what it checks","run":"body of an async function"}],"fill":{"code":"the solution with 3-5 important tokens replaced by [[1]], [[2]], ...","answers":["token for [[1]]","token for [[2]]"],"distractors":["3-5 plausible wrong tokens"]}}
Tests: 3-5 of them. Each run string may use expect(x).toBe(y), expect(x).toEqual(y), expect(fn).toThrow() and await wait(ms) with ms under 200. Tests see the solution's top-level names directly.`,
  fill: `You are creating a fill-in-the-blanks code puzzle for this frontend interview question: "{{q}}" (technology: {{tech}}, topic: {{concept}}).
Write a short, correct, original code example (8-25 lines, in {{lang}}) that answers it, then blank out 3-5 important tokens (keywords, method names, hook names, values).
Reply with only this JSON object:
{"title":"short name","brief":"1-2 sentences describing what the code does","fill":{"code":"the code with tokens replaced by [[1]], [[2]], ...","answers":["token for [[1]]","token for [[2]]"],"distractors":["3-5 plausible wrong tokens"]},"explain":"2-3 sentences on why each blank is what it is"}`,
  output: `You are creating a "what does this print?" puzzle for this frontend interview topic: "{{q}}".
Write 4-12 lines of plain, deterministic JavaScript that logs with console.log and shows the tricky behaviour behind the topic. No DOM, no randomness, no dates.
Reply with only this JSON object:
{"title":"short name","code":"the snippet","answer":"the exact console output, lines joined with \\n, formatted like Node's console.log (arrays as [ 1, 2 ], objects as { a: 1 }, strings inside arrays in single quotes)","wrong":["3 plausible wrong outputs"],"explain":"2-3 sentences explaining the output"}`
};
async function pgGenerate(q){
  if(aiState!=="ready" || !sampleFn){ toast("Making puzzles needs AI, which isn't available in this view."); return; }
  route = {v:"pgc", qid:q.i}; pgState = {generating:true};
  $("#view").innerHTML = `<div class="chead"><span class="eyebrow">${esc(TECH[q.t]?.n||"")} · ${esc(conceptName(q.t,q.c))}</span><h1>${esc(q.q)}</h1></div>
    <div class="panel"><div class="thinking"><span class="dots"><i></i><i></i><i></i></span>Claude is writing a puzzle for this question${q.t==="javascript"?" and then running it to check it works":""}…</div></div>`;
  renderCrumbs(); window.scrollTo({top:0});
  const isOut = q.k==="o";
  const runnable = q.t==="javascript" && !isOut && q.c!=="js_ui" && q.c!=="js_dom_code";
  const lang = q.t==="react"?"React (JSX with hooks)": q.t==="css"?"CSS (and minimal HTML if needed)": q.t==="typescript"?"TypeScript":"JavaScript";
  const tpl = isOut ? GEN_PROMPTS.output : runnable ? GEN_PROMPTS.js : GEN_PROMPTS.fill;
  const prompt = fill(tpl, {q:q.q, concept:conceptName(q.t,q.c), tech:TECH[q.t]?.n||q.t, lang});
  try{
    const r = await sampleFn.json(prompt, {modelTier:"default", cache:false});
    let it = {qid:q.i, t:q.t, c:q.c, l:q.l, title:String(r.title||q.q).slice(0,80), brief:String(r.brief||"")};
    if(isOut){
      it.kind="output"; it.code=String(r.code||""); it.answer=String(r.answer||""); it.wrong=arr(r.wrong,4); it.explain=String(r.explain||"");
      const run = await runCode(it.code, [], {timeout:4000, settle:120});
      const actual = (run.logs||[]).join("\n");
      if(!run.error && actual && actual!==it.answer){ it.answer = actual; it.corrected = true; }
      if(run.error){ it.unverified = true; }
      it.wrong = it.wrong.filter(w=>w!==it.answer).slice(0,3);
      if(it.wrong.length<1) it.wrong=["undefined"];
    } else {
      const f = r.fill||{};
      const answers = arr(f.answers, 8); const code = String(f.code||"");
      const nBlanks = (code.match(/\[\[\d+\]\]/g)||[]).length;
      if(code && nBlanks && nBlanks===answers.length) it.fill = {code, answers, distractors:arr(f.distractors,6)};
      it.explain = String(r.explain||"");
      if(runnable && r.solution && Array.isArray(r.tests)){
        const tests = r.tests.slice(0,6).map(t=>({name:String(t?.name||"test"), run:String(t?.run||"")})).filter(t=>t.run);
        const res = await runCode(String(r.solution), tests, {timeout:5000});
        const passing = res.error? [] : tests.filter((t,i)=>res.results?.find(x=>x[0]===i)?.[1]);
        if(passing.length){
          it.kind="code"; it.write = {starter:String(r.starter||""), solution:String(r.solution), tests:passing};
          if(passing.length<tests.length) it.unverified = true;
          if(it.fill){ const filled = it.fill.code.replace(/\[\[(\d+)\]\]/g,(_,n)=>it.fill.answers[n-1]); const fr = await runCode(filled, passing, {timeout:5000});
            if(fr.error || (fr.results||[]).some(x=>!x[1])) it.fill = null; }
        } else { it.kind="fillonly"; it.unverified = true; }
      } else it.kind = "fillonly";
      if(!it.fill && !it.write) throw {code:"invalid_json"};
    }
    GEN[q.i] = it;
    if(db){ try{ await db.doc("gen/"+safeId(q.i)).set(JSON.parse(JSON.stringify(it))); }catch(e){} }
    if(route.v==="pgc" && route.qid===q.i) pgOpenGen(q.i);
  }catch(e){
    if(!(route.v==="pgc" && route.qid===q.i)) return;
    const msg = e?.code==="rate_limited" ? "You've hit your Claude usage limit for now. Try again a bit later."
      : e?.code==="not_granted"||e?.code==="sampling_disabled" ? "AI isn't allowed for this page, so puzzles can't be made here."
      : "Claude's puzzle didn't come out usable. Try again.";
    $("#view").innerHTML = `<div class="panel"><p class="err" style="margin:0">${esc(msg)}</p><div class="mfoot" style="justify-content:flex-start"><button class="btn primary" type="button" data-practice-q="${esc(q.i)}">Try again</button><button class="btn" type="button" data-pg-home>Back to the playground</button></div></div>`;
  }
}

async function doRun(src, tests, isWrite){
  const st = pgState; const it = pgCurrent(); const id = it.id || route.qid;

  if(isWrite){ try{ localStorage.setItem("ipd_code_"+id, src); }catch(e){} }
  const r = await runCode(src, tests);
  st.running = false; st.error = r.error||null; st.logs = (r.logs||[]).join("\n");
  st.results = (r.results||[]).map(([i,ok,msg])=>({name:tests[i]?.name||("Test "+(i+1)), ok, msg}));
  if(isWrite && !r.error && st.results.length && st.results.every(x=>x.ok)){ setPgp(id,{w:true}); toast("All tests pass"); confetti(); }
  if(route.v==="pgc") render();
}

// ================= MOCK INTERVIEW =================
// The interviewer is a provider with two calls: evaluate(item, session) and summarize(session).
// Today it runs on Claude through the page ("claude" provider); prompts come from agent-spec.json so a
// future API-key agent can reuse the exact same prompts, schemas and stored session shape.
const fill = (tpl, vars) => tpl.replace(/\{\{(\w+)\}\}/g, (_, k) => vars[k] ?? "");
const clampInt = (v, lo, hi) => Math.max(lo, Math.min(hi, Math.round(Number(v)) || 0));
const arr = (v, n) => (Array.isArray(v) ? v : []).map(x=>String(x)).filter(Boolean).slice(0, n);

const PROVIDERS = {
  claude: {
    label: "Claude",
    async evaluate(item, s, signal, final){
      const E = SPEC.evaluation;
      const fu = final ? fill(E.followUpBlock, {followUp:item.followUp, followUpAnswer:item.followUpAnswer}) : "";
      const prompt = fill(E.prompt, {
        tech: TECH[s.t].n, concept: conceptName(s.t, item.c), level: LEVELS[item.l] || "Intermediate",
        question: item.q, answer: item.answer.slice(0, 8000), followUpBlock: fu,
        followUpRule: final ? E.followUpRuleFinal : E.followUpRuleFirst,
        referenceBlock: (()=>{ const R = ANS[item.qid] || PRE[item.qid]; return R && E.referenceBlock ? fill(E.referenceBlock, {reference: [R.a, ...(R.p||[]).map(x=>"- "+x)].join("\n").slice(0, 3000)}) : ""; })()
      });
      const r = await sampleFn.json(prompt, {modelTier: E.modelTier || "default", signal, cache:false});
      return normEval(r, final);
    },
    async summarize(s, signal){
      const S = SPEC.summary;
      const itemsBlock = s.items.filter(it=>it.ev).map((it,i)=>
        `${i+1}. [${conceptName(s.t,it.c)}] ${it.q}\n   score ${it.ev.score}/10; missed: ${(it.ev.missing||[]).join("; ")||"nothing major"}`).join("\n");
      const r = await sampleFn.json(fill(S.prompt, {tech:TECH[s.t].n, itemsBlock, overall:s.summary.overall}), {modelTier:S.modelTier||"default", signal});
      return {headline:String(r?.headline||""), strengths:arr(r?.strengths,3),
        focus:(Array.isArray(r?.focus)?r.focus:[]).slice(0,3).map(f=>({concept:String(f?.concept||""), why:String(f?.why||"")})),
        plan:arr(r?.plan,4)};
    }
  }
  // Future: an "api" provider that posts {item, session} to your own server, which holds the
  // Claude API key and runs the same SPEC prompts. Web pages can't hold keys safely.
};
function normEval(r, final){
  const v = ["strong","good","partial","weak","none"];
  const score = clampInt(r?.score, 0, 10);
  return {score, accuracy:clampInt(r?.accuracy,0,10), depth:clampInt(r?.depth,0,10), clarity:clampInt(r?.clarity,0,10),
    verdict: v.includes(r?.verdict) ? r.verdict : (score>=9?"strong":score>=7?"good":score>=4?"partial":score>=1?"weak":"none"),
    strengths:arr(r?.strengths,3), missing:arr(r?.missing,4), idealAnswer:String(r?.idealAnswer||""),
    followUp: final ? "" : String(r?.followUp||"").trim()};
}

function pickQuestions(t, cs, lv, n){
  let pool = qsFor(t).filter(q=>(!cs || cs.includes(q.c)) && (lv==="all" || q.l===lv));
  const shuffle = a=>{ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
  const g = {fresh:[], weak:[], todo:[], rest:[]};
  for(const q of pool){ const p=PROG[q.i]||{};
    if(p.na==null) g.fresh.push(q); else if((p.ls??10)<6) g.weak.push(q); else if(!p.d) g.todo.push(q); else g.rest.push(q); }
  const ordered = [...shuffle(g.weak), ...shuffle(g.fresh), ...shuffle(g.todo), ...shuffle(g.rest)];
  // interleave: weak first, but cap 3 per concept when several concepts are chosen
  const out = [], per = {}, cap = (cs && cs.length===1) ? n : 3;
  for(const q of ordered){ if(out.length>=n) break; if((per[q.c]||0)>=cap) continue; per[q.c]=(per[q.c]||0)+1; out.push(q); }
  for(const q of ordered){ if(out.length>=n) break; if(!out.includes(q)) out.push(q); }
  return shuffle(out);
}
function scClass(v){ return v>=7?"sc-good":v>=4?"sc-mid":"sc-low"; }
function fmtDate(ms){ try{ return new Date(ms).toLocaleString(undefined,{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}); }catch(e){ return ""; } }
function sessionOverall(s){ const sc=s.items.filter(i=>i.ev).map(i=>i.ev.score); return sc.length? Math.round(sc.reduce((a,b)=>a+b,0)/sc.length*10)/10 : 0; }

function startInterview(){
  const qs = pickQuestions(ivSetup.t, ivSetup.cs, ivSetup.lv, ivSetup.n);
  if(!qs.length) return toast("No questions match these settings.");
  const s = {id:"iv"+Date.now().toString(36), t:ivSetup.t, concepts:ivSetup.cs||null, level:ivSetup.lv, count:qs.length,
    mode: (aiState==="ready" && ivSetup.mode!=="self") ? "ai" : "self", status:"active", startedAt:Date.now(), endedAt:null,
    items: qs.map(q=>({qid:q.i, q:q.q, c:q.c, l:q.l, answer:"", skipped:false, followUp:"", followUpAnswer:"", ev:null})), summary:null};
  saveSession(s);
  IV = {s, idx:0, phase:"answer"}; route={v:"interview"}; render(); window.scrollTo({top:0});
}
function resumeInterview(id){
  const s = SESSIONS.find(x=>x.id===id); if(!s) return;
  const idx = s.items.findIndex(i=>!i.ev && !i.skipped);
  IV = {s, idx: idx<0? s.items.length-1 : idx, phase: idx<0 ? "finishing" : "answer"};
  route={v:"interview"}; render(); if(idx<0) finishInterview();
}

function ivRunView(){
  const {s, idx, phase} = IV; const it = s.items[idx];
  const steps = s.items.map((x,i)=>`<i class="${x.ev? (x.ev.score>=7?"ok":x.ev.score>=4?"mid":"bad") : x.skipped?"bad": i===idx?"on":""}"></i>`).join("");
  const head = `<div class="ivbar"><span class="eyebrow">Question ${idx+1} of ${s.items.length} · ${esc(conceptName(s.t,it.c))} · ${LEVELS[it.l]||""}</span>
      <div class="steps" aria-hidden="true">${steps}</div>
      <button class="btn" type="button" data-iv-end>End interview</button></div>`;
  if(phase==="finishing") return head + `<div class="panel"><div class="thinking"><span class="dots"><i></i><i></i><i></i></span>Writing your interview report…</div></div>`;
  const ask = `<div class="asker"><span class="avatar" aria-hidden="true">AI</span><div class="bubble"><span class="who">Interviewer</span><div class="say">${esc(it.q)}</div></div></div>`;
  let body = "";
  if(phase==="answer" || phase==="followup"){
    const isFu = phase==="followup";
    body = `${isFu?`<div class="ideal"><h4>Your first answer</h4><div style="white-space:pre-wrap">${esc(it.answer)}</div></div>
        <div class="asker"><span class="avatar" aria-hidden="true">AI</span><div class="bubble"><span class="who">Follow-up</span><div class="say fu">${esc(it.followUp)}</div></div></div>`:""}
      <div class="answer field"><label for="iv-ans">${isFu?"Your follow-up answer":"Your answer"}</label>
        <textarea id="iv-ans" placeholder="Answer the way you'd explain it out loud: definition, how it works, an example, trade-offs…">${esc(isFu? it.followUpAnswer : it.answer)}</textarea>
        <div class="row"><span class="hint">${s.mode==="ai"?"Ctrl/Cmd + Enter to submit":"You'll rate yourself after submitting"}</span>
          <span style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn" type="button" data-iv-skip>${isFu?"Skip follow-up":"Skip question"}</button>
            <button class="btn primary" type="button" data-iv-submit>Submit answer</button></span></div>
        ${IV.err?`<div class="err">${esc(IV.err)}</div>`:""}
      </div>`;
  } else if(phase==="evaluating"){
    body = `<div class="ideal"><h4>Your answer</h4><div style="white-space:pre-wrap">${esc(it.answer)}${it.followUpAnswer?`\n\nFollow-up: ${esc(it.followUpAnswer)}`:""}</div></div>
      <div class="row" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
        <div class="thinking"><span class="dots"><i></i><i></i><i></i></span>The interviewer is scoring your answer…</div>
        <button class="btn" type="button" data-iv-stop>Stop</button></div>`;
  } else if(phase==="selfrate"){
    const p = PROG[it.qid]||{};
    body = `<div class="ideal"><h4>Your answer</h4><div style="white-space:pre-wrap">${esc(it.answer)}</div></div>
      ${p.n?`<div class="ideal"><h4>Your saved notes for this question</h4><div style="white-space:pre-wrap">${esc(p.n)}</div></div>`:""}
      <div class="field"><label>How did that go?</label><div class="selfrate">
        ${Object.entries(SPEC?.selfScoring?.scale||{"9":"Nailed it","7":"Mostly","5":"Partly","1":"Didn't know"}).sort((a,b)=>b[0]-a[0]).map(([v,l])=>`<button class="btn" type="button" data-iv-self="${v}">${esc(l)} · ${v}</button>`).join("")}
      </div></div>`;
  } else if(phase==="feedback"){
    body = feedbackBlock(it.ev) + `<div class="mfoot" style="justify-content:space-between">
        <span style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn" type="button" data-iv-star>${PROG[it.qid]?.s?"★ Starred":"☆ Star to revisit"}</button>
          <button class="btn" type="button" data-iv-savenote>Save model answer to my notes</button></span>
        <span style="display:flex;gap:8px;flex-wrap:wrap">
          ${it.ev.followUp && !it.followUpAnswer ? `<button class="btn" type="button" data-iv-fu>Answer the follow-up</button>`:""}
          <button class="btn primary" type="button" data-iv-next>${idx+1<s.items.length?"Next question":"Finish and see report"}</button></span></div>`;
  }
  return head + `<div class="panel">${ask}${body}</div>`;
}
function dial(v){
  const r=40, c=2*Math.PI*r, off=c*(1-v/10);
  return `<div class="dial"><svg viewBox="0 0 96 96" aria-hidden="true"><circle cx="48" cy="48" r="${r}" fill="none" stroke="var(--rule)" stroke-width="8"/>
    <circle cx="48" cy="48" r="${r}" fill="none" stroke="currentColor" class="${scClass(v)}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 48 48)"/></svg>
    <div><div class="score ${scClass(v)}">${v}</div><small>of 10</small></div></div>`;
}
function feedbackBlock(ev){
  if(!ev) return "";
  const sub = (n,v)=>`<div class="sub"><span>${n}</span><span class="bar"><i style="width:${v*10}%"></i></span><b>${v}</b></div>`;
  const self = ev.self;
  return `<div class="fb">${dial(ev.score)}<div class="subs">
      <span class="verdict ${scClass(ev.score)}">${self?"Self-rated":esc(ev.verdict)}</span>
      ${self?`<span class="hint">Rated by you. AI scoring adds accuracy, depth and clarity scores.</span>`:sub("Accuracy",ev.accuracy)+sub("Depth",ev.depth)+sub("Clarity",ev.clarity)}</div></div>
    ${self?"":`<div class="pts">
      <div><h4>What you got right</h4>${ev.strengths.length?`<ul>${ev.strengths.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:`<p class="hint" style="margin:0">Nothing scored yet on this one.</p>`}</div>
      <div><h4>What you missed</h4>${ev.missing.length?`<ul>${ev.missing.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:`<p class="hint" style="margin:0">Nothing important.</p>`}</div></div>
    ${ev.idealAnswer?`<div class="ideal"><h4>A strong answer covers</h4>${esc(ev.idealAnswer)}</div>`:""}`}`;
}

async function submitAnswer(){
  const it = IV.s.items[IV.idx]; const val = ($("#iv-ans")?.value||"").trim();
  const isFu = IV.phase==="followup";
  if(val.length<3){ IV.err = "Type an answer first, or skip this one."; return render(); }
  IV.err = null;
  if(isFu) it.followUpAnswer = val; else it.answer = val;
  if(IV.s.mode==="self"){ IV.phase="selfrate"; return render(); }
  IV.phase = "evaluating"; render();
  const ctl = new AbortController(); IV.ctl = ctl;
  try{
    const ev = await PROVIDERS.claude.evaluate(it, IV.s, ctl.signal, isFu);
    if(IV?.ctl!==ctl) return;
    it.ev = ev; IV.phase = "feedback";
    const p = PROG[it.qid]||{}; writeProg(it.qid, {ls:ev.score, na:(isFu? (p.na||1) : (p.na||0)+1)});
    saveSession(IV.s);
  }catch(e){
    if(IV?.ctl!==ctl) return;
    IV.phase = isFu? "followup" : "answer";
    IV.err = e?.code==="cancelled" ? null
      : e?.code==="not_granted" || e?.code==="sampling_disabled" ? (switchToSelf(), "AI scoring was turned off for this page, so you'll rate your own answers from now on.")
      : e?.code==="rate_limited" ? "You've hit your Claude usage limit for now. Wait a bit and submit again."
      : e?.code==="invalid_json" ? "The score came back garbled. Submit again."
      : "Scoring didn't go through. Check your connection and submit again.";
  }
  render();
}
function switchToSelf(){ aiState="off"; IV.s.mode="self"; saveSession(IV.s); }
function nextQuestion(){
  if(IV.idx+1 < IV.s.items.length){ IV.idx++; IV.phase="answer"; IV.err=null; saveSession(IV.s); render(); window.scrollTo({top:0}); }
  else finishInterview();
}
async function finishInterview(){
  const s = IV.s; IV.phase="finishing"; render();
  const byConcept = {};
  s.items.forEach(it=>{ if(!it.ev) return; const b=byConcept[it.c]||(byConcept[it.c]={sum:0,n:0}); b.sum+=it.ev.score; b.n++; });
  Object.keys(byConcept).forEach(k=>{ const b=byConcept[k]; byConcept[k]={avg:Math.round(b.sum/b.n*10)/10, n:b.n}; });
  s.summary = {overall: sessionOverall(s), byConcept, headline:"", strengths:[], focus:[], plan:[]};
  if(s.mode==="ai" && sampleFn && s.items.some(i=>i.ev)){
    try{ Object.assign(s.summary, await PROVIDERS.claude.summarize(s)); }catch(e){ /* report still works from the scores */ }
  }
  s.status="done"; s.endedAt=Date.now(); saveSession(s);
  IV = null; route={v:"report", id:s.id}; render(); window.scrollTo({top:0});
}
function endInterview(){
  const s = IV.s; IV.ctl?.abort(); IV.ctl=null;
  if(!s.items.some(i=>i.ev)){ // nothing answered: drop it
    SESSIONS = SESSIONS.filter(x=>x.id!==s.id); local.set("ipd_sessions", SESSIONS);
    if(db) db.doc("interviews/"+s.id).delete().catch(()=>{});
    IV=null; render(); return;
  }
  s.items.forEach(i=>{ if(!i.ev) i.skipped=true; });
  finishInterview();
}

function ivReportView(s){
  if(!s) return `<div class="panel"><p style="margin:0">This report isn't available any more.</p><div><button class="btn" type="button" data-iv-home>Back to mock interview</button></div></div>`;
  const sm = s.summary||{overall:sessionOverall(s), byConcept:{}};
  const cons = Object.entries(sm.byConcept||{}).sort((a,b)=>a[1].avg-b[1].avg);
  const answered = s.items.filter(i=>i.ev).length;
  const weak = s.items.filter(i=>i.ev && i.ev.score<6);
  return `<div class="chead"><span class="eyebrow">Interview report · ${esc(TECH[s.t]?.n||s.t)} · ${fmtDate(s.startedAt)}</span>
      <h1>${esc(sm.headline || (sm.overall>=7?"Solid round. Keep these sharp.":sm.overall>=4?"Getting there. A few gaps to close.":"Good practice. Lots to work on."))}</h1></div>
    <div class="iv-grid">
      <section class="panel">
        <div class="fb">${dial(Math.round(sm.overall))}<div class="subs">
          <span class="verdict">Overall ${sm.overall.toFixed(1)} / 10</span>
          <span class="hint tnum">${answered} answered · ${s.items.length-answered} skipped · ${s.mode==="self"?"self-rated":"scored by AI"}</span></div></div>
        ${cons.length?`<div class="field"><label>By concept</label><div style="display:grid;gap:8px">${cons.map(([k,v])=>`<div class="cbar"><span>${esc(conceptName(s.t,k))}</span><span class="bar"><i class="${scClass(v.avg)}" style="width:${v.avg*10}%;background:currentColor"></i></span><b class="mono tnum ${scClass(v.avg)}">${v.avg}</b></div>`).join("")}</div></div>`:""}
        ${sm.strengths?.length?`<div class="pts" style="grid-template-columns:1fr"><div><h4>Strengths</h4><ul>${sm.strengths.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div></div>`:""}
        ${sm.focus?.length?`<div class="pts" style="grid-template-columns:1fr"><div><h4>Focus next</h4><ul>${sm.focus.map(f=>`<li><b>${esc(f.concept)}</b>: ${esc(f.why)}</li>`).join("")}</ul></div></div>`:""}
        ${sm.plan?.length?`<div class="ideal"><h4>Study plan</h4><ol style="margin:0;padding-left:18px;display:grid;gap:4px">${sm.plan.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div>`:""}
        <div class="mfoot" style="justify-content:flex-start">
          ${weak.length?`<button class="btn primary" type="button" data-iv-retry="${s.id}">Retry the ${weak.length} weak question${weak.length>1?"s":""}</button>`:""}
          <button class="btn" type="button" data-iv-home>New interview</button></div>
      </section>
      <section class="panel"><h2>Question by question</h2>
        <ol class="rep-items">${s.items.map(it=>`<li>
          <span class="score ${it.ev?scClass(it.ev.score):""}">${it.ev?it.ev.score:"–"}</span>
          <div style="min-width:0"><div>${esc(it.q)}</div>
            <div class="qmeta" style="margin-top:4px"><span>${esc(conceptName(s.t,it.c))}</span>${it.skipped&&!it.ev?"<span>· skipped</span>":""}</div>
            ${it.ev && !it.ev.self?`<details><summary>Feedback</summary><div style="display:grid;gap:10px;margin-top:8px">
              <div class="ideal"><h4>Your answer</h4><div style="white-space:pre-wrap">${esc(it.answer)}${it.followUpAnswer?`\n\nFollow-up (${esc(it.followUp)}): ${esc(it.followUpAnswer)}`:""}</div></div>
              ${it.ev.missing.length?`<div class="pts" style="grid-template-columns:1fr"><div><h4>Missed</h4><ul>${it.ev.missing.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div></div>`:""}
              ${it.ev.idealAnswer?`<div class="ideal"><h4>A strong answer covers</h4>${esc(it.ev.idealAnswer)}</div>`:""}</div></details>`:""}
          </div></li>`).join("")}</ol></section>
    </div>`;
}

document.addEventListener("click", e=>{
  const el = e.target.closest("button"); if(!el) return;
  const d = el.dataset;
  if(el.id==="ivBtn" || "ivHome" in d){ if(IV && IV.phase!=="report"){ route={v:"interview"}; return render(); } IV=null; route={v:"interview"}; render(); return window.scrollTo({top:0}); }
  if(d.ivLv){ ivSetup.lv=d.ivLv; return render(); }
  if(d.ivC){ const all = conceptsFor(ivSetup.t).filter(c=>qsFor(ivSetup.t,c.k).length).map(c=>c.k);
    let cur = ivSetup.cs ? ivSetup.cs.slice() : all.slice();
    cur = cur.includes(d.ivC) ? cur.filter(x=>x!==d.ivC) : [...cur, d.ivC];
    ivSetup.cs = cur.length===all.length ? null : cur; if(ivSetup.cs && !ivSetup.cs.length) ivSetup.cs=[]; return render(); }
  if("ivAll" in d){ ivSetup.cs = ivSetup.cs ? null : []; return render(); }
  if(d.ivResume) return resumeInterview(d.ivResume);
  if(d.ivReport){ route={v:"report", id:d.ivReport}; render(); return window.scrollTo({top:0}); }
  if(d.ivRetry){ const s=SESSIONS.find(x=>x.id===d.ivRetry); if(!s) return;
    const ids = s.items.filter(i=>i.ev && i.ev.score<6).map(i=>i.qid);
    const qs = ids.map(id=>allQs().find(q=>q.i===id)).filter(Boolean);
    const ns = {id:"iv"+Date.now().toString(36), t:s.t, concepts:s.concepts, level:s.level, count:qs.length, mode:(aiState==="ready"?"ai":"self"), status:"active", startedAt:Date.now(), endedAt:null,
      items: qs.map(q=>({qid:q.i,q:q.q,c:q.c,l:q.l,answer:"",skipped:false,followUp:"",followUpAnswer:"",ev:null})), summary:null};
    saveSession(ns); IV={s:ns, idx:0, phase:"answer"}; route={v:"interview"}; render(); return window.scrollTo({top:0}); }
  if(!IV) return;
  const it = IV.s.items[IV.idx];
  if("ivSubmit" in d) return submitAnswer();
  if("ivSkip" in d){ if(IV.phase==="followup"){ IV.phase="feedback"; it.followUp=""; it.ev.followUp=""; return render(); } it.skipped=true; return nextQuestion(); }
  if("ivStop" in d){ IV.ctl?.abort(); IV.ctl=null; IV.phase = it.followUpAnswer && it.ev ? "followup" : "answer"; return render(); }
  if("ivNext" in d) return nextQuestion();
  if("ivEnd" in d) return endInterview();
  if("ivFu" in d){ it.followUp = it.ev.followUp; IV.phase="followup"; return render(); }
  if(d.ivSelf){ const v=Number(d.ivSelf); it.ev={score:v, accuracy:v, depth:v, clarity:v, verdict:"", strengths:[], missing:[], idealAnswer:"", followUp:"", self:true};
    const p=PROG[it.qid]||{}; writeProg(it.qid,{ls:v, na:(p.na||0)+1}); saveSession(IV.s); IV.phase="feedback"; return render(); }
  if("ivStar" in d){ writeProg(it.qid,{s:!(PROG[it.qid]?.s)}); return render(); }
  if("ivSavenote" in d){ const p=PROG[it.qid]||{}; const add = it.ev.idealAnswer || "";
    if(!add){ return toast("There's no model answer to save for this one."); }
    writeProg(it.qid,{n:(p.n? p.n+"\n\n":"")+"Model answer: "+add}); el.textContent="Saved to notes"; el.disabled=true; return; }
});
document.addEventListener("change", e=>{
  if(e.target.id==="iv-t"){ ivSetup.t=e.target.value; ivSetup.cs=null; render(); }
  if(e.target.id==="iv-n"){ ivSetup.n=Number(e.target.value); }
});
document.addEventListener("submit", e=>{ if(e.target.id==="ivForm"){ e.preventDefault(); startInterview(); } });
document.addEventListener("keydown", e=>{ if(e.target.id==="iv-ans" && e.key==="Enter" && (e.ctrlKey||e.metaKey)){ e.preventDefault(); submitAnswer(); } });
document.addEventListener("input", e=>{ if(e.target.id==="iv-ans" && IV){ const it=IV.s.items[IV.idx]; if(IV.phase==="followup") it.followUpAnswer=e.target.value; else it.answer=e.target.value; } });

// ---------- boot ----------
render();
fetch("questions.json").then(r=>r.json()).then(d=>{ BANK = d.questions; ALIASES = d.aliases||{}; render(); setTimeout(migrateAliases, 0); })
  .catch(()=>{ $("#view").insertAdjacentHTML("afterbegin", `<p class="err">The question bank didn't load. Reload the page to try again.</p>`); });
fetch("answers.json").then(r=>r.json()).then(d=>{ PRE = d.answers||{}; LIS = d.li||{}; if(route.v==="concept"||route.v==="tech") softRender(); }).catch(()=>{});
fetch("playground.json").then(r=>r.json()).then(d=>{ PG = d; render(); }).catch(()=>{});
fetch("sources.json").then(r=>r.json()).then(d=>{ SRC = d; render(); }).catch(()=>{});
fetch("agent-spec.json").then(r=>r.json()).then(d=>{ SPEC = d; initAI(); })
  .catch(()=>{ aiState="off"; ivSetup.mode="self"; if(route.v==="interview") softRender(); });
initDb();
})();
</script>
